<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#161616" />
    <title>Sin conexión | Puerta AFRO IN</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #161616;
        color: #f3e9d2;
        font-family: "Outfit", system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        box-sizing: border-box;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: "Anton", "Outfit", sans-serif;
        font-weight: 400;
        font-size: 2.75rem;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        max-width: 20rem;
        opacity: 0.8;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 0;
        background: #f3e9d2;
        color: #161616;
        padding: 0.9rem 1.75rem;
        font: inherit;
        font-weight: 700;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>La puerta necesita internet para validar las entradas.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
